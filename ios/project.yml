# XcodeGen 프로젝트 정의. `cd ios && xcodegen generate` 로 MacAgent.xcodeproj 를 만든다(생성물, gitignore).
# 소스는 디렉토리 기반 자동 수집(MacAgent/, MacAgentTests/). Swift 파일을 추가하면 generate 를 다시 실행한다.
name: MacAgent

options:
  bundleIdPrefix: dev.mam
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptySchemes: false

# 서명(DEVELOPMENT_TEAM)은 로컬 전용 Local.xcconfig 에서 온다. 예시는 Local.xcconfig.example.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"

# ADR-012: SwiftPM 패키지는 이 둘만 허용한다.
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: "2.3.0"

targets:
  MacAgent:
    type: application
    platform: iOS
    sources:
      - MacAgent
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: Highlightr
        product: Highlightr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mam.MacAgent
    info:
      path: MacAgent/Info.plist
      properties:
        CFBundleDisplayName: MacAgent
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 개발 서버(http://127.0.0.1:7777)만 허용. 프로덕션은 HTTPS(tailscale cert)이므로 NSAllowsArbitraryLoads 는 켜지 않는다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 실기기에서 같은 Wi-Fi/핫스팟의 Mac(사설 IP)에 붙으려면 iOS 로컬 네트워크 권한이 필요하다. 이 키가 없으면 요청이 조용히 실패한다.
        NSLocalNetworkUsageDescription: 같은 네트워크에 있는 Mac 서버에 연결하려면 로컬 네트워크 접근이 필요합니다.
        ITSAppUsesNonExemptEncryption: false

  MacAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MacAgentTests
      # 프로토콜 fixture 를 폴더 참조로 번들에 복사한다(테스트 번들 안 fixtures/ 디렉토리).
      - path: ../packages/protocol/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: MacAgent
    settings:
      base:
        # 테스트 번들은 별도 Info.plist 파일 없이 빌드 시 자동 생성한다.
        GENERATE_INFOPLIST_FILE: "YES"

  MacAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MacAgentUITests
    dependencies:
      - target: MacAgent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  MacAgent:
    build:
      targets:
        MacAgent: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacAgentTests
        # 개발 서버(MAM_UI_TEST_SERVER)가 없으면 XCTSkip 이라 게이트를 늦추지 않는다.
        - MacAgentUITests
      gatherCoverageData: false
      environmentVariables:
        # `MAM_UI_TEST_SERVER=http://127.0.0.1:7777 xcodebuild test` 처럼 셸 환경변수를 테스트 프로세스로 넘긴다.
        - variable: MAM_UI_TEST_SERVER
          value: "$(MAM_UI_TEST_SERVER)"
          isEnabled: true
